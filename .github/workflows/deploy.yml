name: Construire et publier

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"   # chaque lundi, 4 h 41 UTC : arrêtés et communes à jour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://argilearena.fr' }}
      NOINDEX: ${{ vars.NOINDEX || '1' }}
      CF_BEACON: ${{ vars.CF_BEACON || '' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Données de la publication précédente : servent de secours si un service public est indisponible
      - name: Cache des données publiques
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Télécharger les données publiques
        run: npm run data:fetch
      - name: Croiser les données
        run: npm run data:prepare
      - name: Contrôler les données
        run: npm run check
      - name: Construire le site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
